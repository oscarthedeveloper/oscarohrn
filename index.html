<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Oscar Öhrn — en samling webbprojekt och idéerna bakom dem.">
  <title>Oscar Öhrn</title>
  <link rel="stylesheet" href="/vendor/lenis/lenis.css">
  <style>
    :root { color-scheme: light; --ink: #111; --paper: #fff; --yellow: #fff36a; }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: auto; scroll-padding-top: 32px; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Courier New", Courier, monospace; font-size: 15px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
    ::selection { background: var(--yellow); color: var(--ink); }
    a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 5px; }
    a:hover { background: var(--yellow); }
    a:focus-visible { outline: 2px solid var(--ink); outline-offset: 6px; }
    mark { color: inherit; background: linear-gradient(transparent 15%, var(--yellow) 15%, var(--yellow) 88%, transparent 88%); padding: 0 .08em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
    .page { max-width: 1032px; margin: auto; padding: 46px 56px 28px; }
    .masthead { display: flex; justify-content: space-between; align-items: baseline; gap: 24px; }
    .wordmark { font-size: 16px; font-weight: 700; text-decoration: none; letter-spacing: -.04em; }
    nav { display: flex; gap: 30px; font-size: 12px; }
    nav a { text-decoration: none; }
    .intro { padding: 114px 0 94px; }
    .eyebrow, .section-label, .meta { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; font-weight: 400; }
    .eyebrow { margin: 0 0 29px; }
    h1 { max-width: 800px; margin: 0; font-size: clamp(38px, 5.4vw, 62px); font-weight: 400; line-height: 1.13; letter-spacing: -.065em; }
    .intro-copy { max-width: 495px; margin: 30px 0 0 170px; }
    .section { display: grid; grid-template-columns: 170px minmax(0, 1fr); border-top: 1px solid var(--ink); padding: 27px 0 0; }
    .section-label { margin: 5px 0 0; }
    .project { padding: 0 0 33px; }
    .project + .project { border-top: 1px solid var(--ink); padding-top: 28px; }
    .project-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; }
    h3 { margin: 0; font-size: 24px; font-weight: 400; line-height: 1.3; letter-spacing: -.055em; }
    h3 a { text-decoration: none; }
    .arrow { display: inline-block; margin-left: 7px; font-size: 22px; }
    .number { font-size: 11px; }
    .project p { max-width: 530px; margin: 17px 0 19px; }
    .meta { margin: 0; font-size: 10px; letter-spacing: .06em; }
    .about { margin-top: 27px; padding-bottom: 57px; }
    .about p { max-width: 540px; margin: 0 0 18px; }
    .about p:last-child { margin-bottom: 0; }
    footer { border-top: 1px solid var(--ink); padding-top: 21px; display: flex; justify-content: space-between; gap: 20px; font-size: 11px; }
    footer p { margin: 0; }
    .skip { position: absolute; left: 20px; top: -100px; background: white; padding: 10px; }
    .skip:focus { top: 10px; }
    @media (max-width: 650px) {
      .page { padding: 27px 24px 24px; }
      nav { gap: 20px; }
      .intro { padding: 79px 0 62px; }
      h1 { font-size: clamp(36px, 8.8vw, 54px); }
      .intro-copy { margin: 25px 0 0; }
      .section { grid-template-columns: 1fr; gap: 26px; padding-top: 20px; }
      .section-label { margin: 0; }
      h3 { font-size: 23px; }
      .about { margin-top: 15px; padding-bottom: 39px; }
      footer { font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    @media print { .page { max-width: none; padding: 20px; } .intro { padding: 50px 0; } nav, .skip, .back-top { display: none; } .project { break-inside: avoid; } }
  
    [hidden] { display: none !important; }
    button,input { font: inherit; color: inherit; }
    button { background: white; border: 1px solid #111; padding: 6px 10px; cursor: pointer; }
    button:hover { background: var(--yellow); }
    button:disabled { opacity: .5; cursor: wait; }
    input { background: white; border: 1px solid #111; padding: 9px; max-width: 100%; }
    .upcoming .project-content { opacity: .48; }
    .status-label { font-size: 10px; letter-spacing: .05em; text-transform: uppercase; }
    .editor-bar { position: sticky; top: 0; z-index: 10; background: white; border-bottom: 1px solid; padding: 12px 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; font-size: 12px; }
    .editor-bar p { margin: 0; flex: 1; }
    .edit-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 12px 0 22px; font-size: 11px; }
    .edit-tools input { flex: 1; min-width: 150px; }
    [contenteditable] { outline: 1px dashed #aaa; outline-offset: 5px; min-height: 1.3em; }
    [contenteditable]:focus { outline: 1px solid #111; }
    .editing .upcoming .project-content { opacity: .7; }
    .editing .intro { padding-top: 65px; }
    .block-heading { font-size: 20px; margin: 20px 0; font-weight: 400; }
    .login { max-width: 430px; margin: 10vh auto; padding: 24px; }
    .login h1 { font-size: 30px; margin-bottom: 28px; }
    .login label { display: block; margin: 18px 0; }
    .login input { display: block; width: 100%; margin-top: 5px; }
    .notice { font-size: 12px; }
    .public-error { margin: 20px auto; max-width: 920px; padding: 15px; border: 1px solid; }
    .intro-copy p { margin-top: 0; }
    @media (max-width:650px) { .editor-bar { padding: 10px 16px; } }
  </style>
</head>
<body id="toppen">
  <div id="editor" hidden></div>
  <div id="login" hidden></div>
  <div id="notice" role="status" hidden></div>
  <div id="site"></div>
  <script type="module" src="/scroll.js"></script>
  <script src="/config.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
